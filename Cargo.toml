[package]
name = "pico2w-embassy"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "rp235xa",
    "time-driver",
    "critical-section-impl",
] }
embassy-net = { version = "0.9.1", features = [
    "defmt",
    "tcp",
    "medium-ethernet",
    "proto-ipv4",
] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.10", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }

static_cell = "2.1.1"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
